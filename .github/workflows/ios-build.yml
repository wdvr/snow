name: iOS Build

on:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ios/**'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  build:
    name: Build & Archive
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    outputs:
      build_number: ${{ steps.version.outputs.build }}
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select Xcode
      run: |
        XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
        if [ -z "$XCODE_PATH" ]; then
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
        fi
        if [ -z "$XCODE_PATH" ]; then
          XCODE_PATH="/Applications/Xcode.app"
        fi

        if [ -d "$XCODE_PATH" ]; then
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer" || true
        else
          echo "Using default Xcode"
        fi
        xcodebuild -version

    - name: Install XcodeGen
      run: which xcodegen || brew install xcodegen

    - name: Generate Xcode project
      run: |
        cd ios
        xcodegen generate

    - name: Resolve Swift Package Dependencies
      run: |
        xcodebuild -resolvePackageDependencies \
          -project ios/PowderChaser.xcodeproj \
          -scheme PowderChaser

    - name: Calculate build number
      id: version
      env:
        ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        ASC_BUNDLE_ID: com.wouterdevriendt.snowtracker
      run: |
        # Date-based build number YYYYMMDDNN (runner-local date), the same scheme
        # as builds uploaded by hand from the release Mac. NN is one more than the
        # highest build already in App Store Connect today, and the result is always
        # above every existing build, so TestFlight uploads are never rejected as
        # lower/duplicate. PR builds are never uploaded and get YYYYMMDD00.
        TODAY=$(date +%Y%m%d)
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BUILD="${TODAY}00"
        else
          python3 -c "import jwt, cryptography" 2>/dev/null || \
            pip3 install --quiet --break-system-packages PyJWT cryptography
          cat > "$RUNNER_TEMP/latest_build.py" <<'PY'
        import json, os, time, urllib.parse, urllib.request
        import jwt
        api = "https://api.appstoreconnect.apple.com/v1"
        now = int(time.time())
        token = jwt.encode(
            {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
            os.environ["ASC_PRIVATE_KEY"].replace("\r", ""),
            algorithm="ES256",
            headers={"kid": os.environ["ASC_KEY_ID"]},
        )
        def get(path):
            req = urllib.request.Request(api + path, headers={"Authorization": f"Bearer {token}"})
            with urllib.request.urlopen(req, timeout=30) as resp:
                return json.load(resp)["data"]
        bundle_id = os.environ["ASC_BUNDLE_ID"]
        apps = get("/apps?" + urllib.parse.urlencode({"filter[bundleId]": bundle_id}))
        app_id = next(a["id"] for a in apps if a["attributes"]["bundleId"] == bundle_id)
        builds = get(f"/builds?filter[app]={app_id}&sort=-uploadedDate&limit=200&fields[builds]=version")
        print(max([int(b["attributes"]["version"]) for b in builds if b["attributes"]["version"].isdigit()] + [0]))
        PY
          LATEST=$(python3 "$RUNNER_TEMP/latest_build.py") || { echo "::error::Could not read existing builds from App Store Connect"; exit 1; }
          BUILD=$(( LATEST >= ${TODAY}01 ? LATEST + 1 : ${TODAY}01 ))
          echo "Highest existing build in App Store Connect: $LATEST"
        fi
        PLIST="ios/PowderChaser/Info.plist"
        VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" 2>/dev/null || echo "1.0.0")

        # Update build number in main Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST" 2>/dev/null || \
        /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" "$PLIST"

        # Update widget Info.plist
        WIDGET_PLIST="ios/PowderChaserWidget/Info.plist"
        if [ -f "$WIDGET_PLIST" ]; then
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$WIDGET_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$WIDGET_PLIST" 2>/dev/null || true
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "build=$BUILD" >> $GITHUB_OUTPUT
        echo "Building version $VERSION ($BUILD)"

    - name: Setup App Store Connect API Key
      if: github.event_name != 'pull_request'
      run: |
        mkdir -p $RUNNER_TEMP/private_keys
        echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" | tr -d '\r' > $RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        chmod 600 $RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

    - name: Build (PR - no signing)
      if: github.event_name == 'pull_request'
      run: |
        xcodebuild build \
          -project ios/PowderChaser.xcodeproj \
          -scheme PowderChaser \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO

    - name: Archive app (with signing lock)
      if: github.event_name != 'pull_request'
      env:
        CERT_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
        CERT_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      run: |
        LOCKFILE="/tmp/ios-signing.lock"
        KEYCHAIN_PATH="$HOME/ios-signing.keychain-db"
        KEYCHAIN_PASSWORD="ios-signing-shared"

        # Acquire lock (wait up to 10 minutes for other runners)
        echo "Waiting for signing lock..."
        for i in $(seq 1 120); do
          if (set -C; echo $$ > "$LOCKFILE") 2>/dev/null; then
            echo "Lock acquired"
            break
          fi
          LOCK_PID=$(cat "$LOCKFILE" 2>/dev/null)
          if [ -n "$LOCK_PID" ] && ! kill -0 "$LOCK_PID" 2>/dev/null; then
            rm -f "$LOCKFILE"
            continue
          fi
          sleep 5
        done

        cleanup_lock() { rm -f "$LOCKFILE"; }
        trap cleanup_lock EXIT

        # Setup persistent signing keychain (shared across all runners)
        if [ ! -f "$KEYCHAIN_PATH" ]; then
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        fi
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        # Import distribution cert if not already present
        DIST_COUNT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null | grep "Apple Distribution" | wc -l | tr -d ' ')
        if [ "$DIST_COUNT" -eq "0" ]; then
          echo "Importing distribution certificate..."
          echo "$CERT_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f $RUNNER_TEMP/cert.p12
        fi

        # Ensure signing keychain is in search list and set as default for build
        CURRENT_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
        if ! echo "$CURRENT_KEYCHAINS" | grep -q "ios-signing.keychain-db"; then
          security list-keychains -d user -s "$KEYCHAIN_PATH" $CURRENT_KEYCHAINS
        fi
        security default-keychain -s "$KEYCHAIN_PATH"

        # Do NOT revoke or delete dev certs — the signing keychain persists
        # the CI-created dev cert across builds. Revoking breaks other repos
        # that share the same Apple developer account.
        security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -5

        # Ensure codesign can access keychain without UI prompt
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" 2>/dev/null || true

        security find-identity -v -p codesigning | head -5

        # Archive unsigned, then ad-hoc sign with the target entitlements. The
        # Export step re-signs with Apple Distribution and keeps them. A signed
        # archive needs an Apple Development identity, and the team's only valid
        # dev cert lives in the login keychain, which is locked for the runner.
        xcodebuild archive \
          -project ios/PowderChaser.xcodeproj \
          -scheme PowderChaser \
          -configuration Release \
          -archivePath $RUNNER_TEMP/Export/App.xcarchive \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM=${{ env.TEAM_ID }} \
          CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }}

        APP=$(ls -d $RUNNER_TEMP/Export/App.xcarchive/Products/Applications/*.app)
        for FW in "$APP"/Frameworks/*; do
          [ -e "$FW" ] && codesign --force --sign - "$FW"
        done
        codesign --force --sign - \
          --entitlements ios/PowderChaserWidget/PowderChaserWidget.entitlements \
          "$APP/PlugIns/PowderChaserWidgetExtension.appex"
        codesign --force --sign - \
          --entitlements ios/PowderChaser/PowderChaser.entitlements \
          "$APP"

    - name: Export IPA
      if: github.event_name != 'pull_request'
      run: |
        cat > /tmp/ExportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ env.TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
        </dict>
        </plist>
        EOF

        security unlock-keychain -p "ios-signing-shared" "$HOME/ios-signing.keychain-db" 2>/dev/null || true
        xcodebuild -exportArchive \
          -archivePath $RUNNER_TEMP/Export/App.xcarchive \
          -exportPath $RUNNER_TEMP/Export \
          -exportOptionsPlist /tmp/ExportOptions.plist \
          -allowProvisioningUpdates \
          -authenticationKeyPath $RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
          -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
          -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    - name: Upload Crashlytics dSYMs
      if: github.event_name != 'pull_request'
      run: |
        DSYM_PATH="${{ runner.temp }}/Export/App.xcarchive/dSYMs"
        UPLOAD_SCRIPT=$(find ~/Library/Developer/Xcode/DerivedData -name "upload-symbols" -path "*/firebase-ios-sdk/Crashlytics/*" 2>/dev/null | head -1)
        if [ -z "$UPLOAD_SCRIPT" ]; then
          echo "::warning::upload-symbols not found in DerivedData, skipping Crashlytics dSYM upload"
        elif [ ! -d "$DSYM_PATH" ]; then
          echo "::warning::dSYMs directory not found at $DSYM_PATH"
        else
          echo "Uploading dSYMs from $DSYM_PATH"
          "$UPLOAD_SCRIPT" \
            -gsp ios/PowderChaser/PowderChaser/Resources/GoogleService-Info.plist \
            -p ios "$DSYM_PATH"/*.dSYM
          echo "Crashlytics dSYM upload complete"
        fi

    - name: Upload IPA artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ipa-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
        path: |
          ${{ runner.temp }}/Export/*.ipa
          ${{ runner.temp }}/Export/App.xcarchive/dSYMs
        retention-days: 30

    - name: Summary
      run: |
        echo "## Build Successful" >> $GITHUB_STEP_SUMMARY
        echo "- **Scheme**: PowderChaser" >> $GITHUB_STEP_SUMMARY
        echo "- **Bundle ID**: com.wouterdevriendt.snowtracker" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }})" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "- **Artifact**: ipa-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "Run **TestFlight Internal** workflow to upload to TestFlight." >> $GITHUB_STEP_SUMMARY

    - name: Cleanup
      if: always()
      run: |
        security default-keychain -s ~/Library/Keychains/login.keychain-db 2>/dev/null || true
        rm -rf $RUNNER_TEMP/private_keys $RUNNER_TEMP/Export
